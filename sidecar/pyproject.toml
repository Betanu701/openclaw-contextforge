[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextforge-openclaw-sidecar"
version = "0.1.0"
description = "HTTP sidecar exposing ContextForge memory to OpenClaw"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contextforge_sidecar*"]

